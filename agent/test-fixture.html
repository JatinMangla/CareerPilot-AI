<!doctype html>
<!-- Local test fixture: mimics a typical Greenhouse/Lever application form.
     Used to verify the agent's field detection without touching a real employer's site.
     Run: npm run apply   (with a queue pointing at this file) -->
<html>
  <head><meta charset="utf-8" /><title>Senior Frontend Engineer — Test Co</title></head>
  <body style="font-family: system-ui; max-width: 640px; margin: 40px auto">
    <h1>Apply — Senior Frontend Engineer</h1>
    <form id="app">
      <p><label for="first_name">First Name *</label><br />
        <input id="first_name" name="first_name" required /></p>

      <p><label for="last_name">Last Name *</label><br />
        <input id="last_name" name="last_name" required /></p>

      <p><label for="email">Email *</label><br />
        <input id="email" name="email" type="email" required /></p>

      <p><label for="phone">Phone</label><br />
        <input id="phone" name="phone" /></p>

      <p><label for="loc">Current Location (City)</label><br />
        <input id="loc" name="location" /></p>

      <p><label for="resume">Resume/CV *</label><br />
        <input id="resume" name="resume" type="file" required /></p>

      <p><label for="li">LinkedIn Profile</label><br />
        <input id="li" name="urls[LinkedIn]" /></p>

      <p><label for="gh">GitHub URL</label><br />
        <input id="gh" name="urls[GitHub]" /></p>

      <p><label for="cover">Cover Letter — why do you want to join us?</label><br />
        <textarea id="cover" name="cover_letter" rows="5" cols="60"></textarea></p>

      <p><label for="notice">What is your notice period?</label><br />
        <input id="notice" name="notice_period" /></p>

      <p><label for="ctc">Expected CTC</label><br />
        <input id="ctc" name="expected_salary" /></p>

      <p><label for="yoe">Years of experience with React</label><br />
        <select id="yoe" name="react_years">
          <option value="">Select…</option>
          <option value="0-1">0-1 years</option>
          <option value="1-3">1-3 years</option>
          <option value="3-5">3-5 years</option>
        </select></p>

      <fieldset><legend>Are you authorized to work in India?</legend>
        <label><input type="radio" name="auth" value="y" /> Yes</label>
        <label><input type="radio" name="auth" value="n" /> No</label>
      </fieldset>

      <fieldset><legend>Gender (voluntary)</legend>
        <label><input type="radio" name="gender" value="m" /> Male</label>
        <label><input type="radio" name="gender" value="f" /> Female</label>
        <label><input type="radio" name="gender" value="d" /> Decline to self-identify</label>
      </fieldset>

      <p><button type="submit">Submit Application</button></p>
    </form>
    <script>
      document.getElementById('app').addEventListener('submit', (e) => {
        e.preventDefault();
        document.body.innerHTML = '<h1>Thank you for applying!</h1><p>Your application has been received.</p>';
      });
    </script>
  </body>
</html>
